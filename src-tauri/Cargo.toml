[package]
name = "nolanguage"
version = "0.7.10"
description = "Nolanguage — unified multi-language dev & execution platform"
authors = ["Nolanguage"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nolanguage_lib"
path = "src/lib.rs"

[[bin]]
name = "nolanguage"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direct dependencies for the WebView2 settings in `lib.rs::harden_webview`
# (both already in Cargo.lock as tauri transitive dependencies).
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
