name: CI

# Windows-first platform (Node SEA exe, system WebView2, Go discovery), so CI
# runs on windows-latest. Python is preinstalled on that image; Go is added
# explicitly so the packaged-exe smoke test exercises it.
#
# Four jobs, split by what they depend on rather than by importance:
#
#   pure        no server, no spawn, no toolchain      (~2 min, the inner loop)
#   ui          mounts the page in jsdom + boots one server for the budgets
#   toolchains  one matrix leg per language that needs an interpreter
#   integration everything that needs the packaged exe, and the full sweep
#
# The reason for the split is latency, not tidiness: the UI suites and a language
# suite used to wait behind a 10-minute exe build, so their failures arrived long
# after the pure gate went green and developers had already moved on. Nothing here
# is skipped in `integration` — `npm run verify` still runs the whole sweep, and a
# suite that passes alone but fails inside the sweep is a real regression.
#
# Every step is an npm script, never an inline command line. That is not tidiness:
# it is what makes "CI would pass" checkable from a developer's machine, because
# `npm run ci:pure` runs the same three commands in the same order. When the
# command lived only in this file, the only place it could ever run was a runner,
# and the claim could not be tested at all.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 1-3 — types, unit tests, and every suite that needs no server, no
  # toolchain, no browser and no packaged exe. This is the loop a developer
  # waits for, so it must stay short.
  pure:
    name: Types + unit + pure suites
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # esbuild / postject / jsdom are devDependencies, so this one step is the
      # whole toolchain: no transient `npm install --no-save` to fail on a
      # registry hiccup halfway through a job.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # Every suite marked `pure: true` in scripts/verify-all.mjs: statistics,
      # migration readers, handshake table, signing wiring, page
      # self-containment, the architecture and doc contracts. No ports, no
      # spawns, no exe. The count is deliberately not written here — it was 10
      # when this comment was written and 14 by the time anyone checked.
      - name: Pure suites
        run: npm run verify:pure

      # The workflow is a claim too: every `npm run` it names has to exist, and
      # it has to install from the lockfile rather than resolving afresh.
      - name: Check the workflow
        run: npm run verify:ci

  # Gate 4-5 — the browser shell and the budgets. Needs no toolchain and no exe, so
  # it can run beside the pure gate instead of behind the packaged build. The DOM
  # suite is where a fragment that references an unknown seed, or a dialog whose
  # handler throws, actually fails.
  ui:
    name: UI shell + performance budgets
    runs-on: windows-latest
    timeout-minutes: 20
    needs: pure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Includes `verify:client` (fragment text safety) first, so a backtick in a
      # fragment is reported with file:line rather than as "the page did not mount".
      - name: Verify the PyCharm shell
        run: npm run verify:ui

      - name: Verify the Dev Panel DOM
        run: npm run verify:ui-dom

      # Weight, cold-start latency, and the "no network at boot" contract — all
      # three are ratchets with the measured value printed, so a regression names
      # the number it crossed.
      - name: Verify performance budgets
        run: npm run verify:perf

  # Gate 6 — one leg per language whose suite needs a real interpreter. A matrix
  # rather than one job so a Go-only failure does not read as "the build is broken",
  # and so adding a language costs one line instead of one more job.
  toolchains:
    name: Toolchain · ${{ matrix.lang }}
    runs-on: windows-latest
    timeout-minutes: 20
    needs: pure
    strategy:
      fail-fast: false
      matrix:
        lang: [go, javascript, markdown]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: 'stable'

      - name: Install dependencies
        run: npm ci

      # Each suite SKIPs (rather than fails) the parts whose toolchain is absent, so
      # a bare runner still exercises the degradation path.
      - name: Verify ${{ matrix.lang }}
        run: npm run verify:${{ matrix.lang }}

  # Gate 7-9 — everything that boots a server, spawns a toolchain, mounts a DOM
  # or runs the packaged binary. Depends on `pure` so a logic failure stops the
  # expensive work before it starts.
  integration:
    name: Integration + packaged exe
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [pure, ui, toolchains]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install dependencies
        run: npm ci

      # `build:exe` runs `postbuild:exe`, which mirrors dist/Nolanguage.exe into
      # src-tauri/binaries via scripts/sync-sidecar.mjs — the shell can no
      # longer ship a stale engine.
      - name: Build packaged exe
        run: npm run build:exe

      - name: Verify sidecar mirror
        run: npm run verify:sidecar

      # The dependency features (read / install / post-install refresh) and the
      # completion trio only prove themselves against the shipped binary: the
      # suite launches dist/Nolanguage.exe and drives it over the panel's own
      # WebSocket. It writes a project-tier plugin so the install runs the real
      # code path without needing the network.
      - name: Verify dependency features in the packaged exe
        run: npm run verify:packages-exe

      # The other three languages have no bundled language server, so what this
      # pins down is the degradation: every request that cannot be served must
      # name its reason instead of answering with an empty list.
      - name: Verify Go / JavaScript / Markdown in the packaged exe
        run: npm run verify:langs-exe

      # The manager is language-agnostic, so this runs without jdtls: pooling,
      # cancellation and cache invalidation are exercised against a fake server,
      # and the jdtls block SKIPs when the server is absent.
      - name: Verify the pooled LSP manager
        run: npm run verify:lsp-manager

      # Deterministic and server-independent: the fake server can hang, crash and
      # log every method, so these run on a runner with nothing installed.
      - name: Verify LSP protocol behaviour
        run: npm run verify:lsp-protocol

      # SKIPs any language whose server is absent; on a bare runner that is all
      # of them, which is still a useful signal (the suite must not fail).
      - name: Verify LSP semantics baseline
        run: npm run verify:lsp-semantics

      # Shape and coverage of perf-baseline.json always run; the measurements
      # SKIP every language whose server is absent, so a bare runner still gets
      # the contract checks (no eager python, baseline covers every language).
      - name: Verify startup baseline
        run: npm run verify:startup

      # The whole regression: kernel, panel, Python/Go loops, baseline,
      # extension host, explorer, WebView host, PyCharm shell, Dev Panel DOM,
      # packaged-exe smoke. The pure suites run again here on purpose — they are
      # cheap, and a suite that passes without the exe but fails with it is
      # exactly the regression this job exists to catch.
      - name: Verify all suites
        run: npm run verify

      # Gate — the artifact users actually run: build the NSIS installer,
      # install it silently, start the app, and probe /health.
      #
      # `ci:nsis` first: a fresh runner has no makensis, and the Tauri step that
      # would download one runs later (and is allowed to fail). The script is a
      # no-op on a machine that already has NSIS, so it costs a developer
      # nothing and is the only reason the installer step works on CI.
      - name: Ensure NSIS
        run: npm run ci:nsis

      - name: Build installer
        run: npm run build:setup

      # The body of this check is installer/smoke-install.ps1, so it can also be
      # run locally (`npm run ci:install-smoke`). It does modify the machine
      # while it runs — registry entries, Start Menu shortcuts — which is why it
      # is not part of the default suite.
      - name: Silent install + health smoke
        run: npm run ci:install-smoke

      # Gate — Tauri shell package. Optional: it compiles Rust and may need to
      # download NSIS/WiX on a cold runner, so a network hiccup must not fail the
      # job (the NSIS package above is already verified end to end). While the
      # WebView2 runtime question is open (see CHANGELOG 0.7.3), this gate is
      # informational only.
      - name: Build Tauri package (optional)
        run: npm run tauri -- build --bundles nsis
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          if-no-files-found: warn
          path: |
            installer/Nolanguage-Setup.exe
            src-tauri/target/release/bundle/nsis/*.exe
